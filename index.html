<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your Sun Peaks shortlist · Black Diamond Lodge</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #0d0d14; color: #eee; padding: 24px 16px calc(32px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 560px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .brand svg { width: 42px; height: 42px; flex: none; }
  .brand-name { display: block; letter-spacing: .28em; font-weight: 600; font-size: 14px; color: #e8eef5; }
  .brand-sub { display: block; letter-spacing: .35em; font-weight: 600; font-size: 10px; color: #7cc4ff; margin-top: 2px; }
  h1 { font-size: 26px; margin: 6px 0 4px; }
  p.sub { color: #9a9aaa; margin: 0 0 22px; font-size: 14px; }
  a.place { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;
            background: #1a1a26; border: 1px solid #2a2a3a; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  a.place:active { background: #24243a; }
  .pin { flex: none; width: 40px; height: 40px; border-radius: 50%; background: #f39c32; color: #111;
         display: grid; place-items: center; font-weight: 700; }
  .name { font-weight: 600; font-size: 17px; }
  .hint { color: #9a9aaa; font-size: 13px; }
  .go { margin-left: auto; color: #8ab4ff; font-size: 22px; }
  .empty { text-align: center; color: #9a9aaa; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true"><polygon points="50,3 97,50 50,97 3,50" fill="#fff"/><polygon points="50,11 89,50 50,89 11,50" fill="none" stroke="#0b1622" stroke-opacity=".35" stroke-width="1.5"/><path fill="#0b1622" d="M28 56.67V55.59H29.71V44.41H28V43.33H35.9Q38.34 43.33 39.57 44.15Q40.79 44.98 40.79 46.63Q40.79 47.82 39.95 48.51Q39.1 49.21 37.44 49.39Q39.45 49.58 40.52 50.46Q41.59 51.34 41.59 52.81Q41.59 54.79 40.1 55.73Q38.6 56.67 35.41 56.67ZM33.14 48.9H34.32Q35.85 48.9 36.59 48.34Q37.33 47.78 37.33 46.63Q37.33 45.47 36.62 44.94Q35.9 44.41 34.32 44.41H33.14ZM33.14 55.59H34.42Q36.13 55.59 36.95 54.91Q37.77 54.23 37.77 52.81Q37.77 51.38 36.94 50.67Q36.11 49.97 34.42 49.97H33.14ZM49.14 55.59H50.38Q52.47 55.59 53.44 54.25Q54.41 52.91 54.41 49.99Q54.41 47.08 53.45 45.75Q52.48 44.41 50.38 44.41H49.14ZM44 56.67V55.59H45.7V44.41H44V43.33H50.84Q54.43 43.33 56.33 45.05Q58.24 46.76 58.24 49.99Q58.24 53.23 56.33 54.95Q54.42 56.67 50.84 56.67ZM60.4 56.67V55.59H62.1V44.41H60.4V43.33H67.26V44.41H65.54V55.44H70.79V53.34H72V56.67Z"/></svg><div><span class="brand-name">BLACK DIAMOND LODGE</span><span class="brand-sub">SUN PEAKS · BC</span></div></div>
  <h1>Your shortlist</h1>
  <p class="sub">Tap a place for directions, menu, hours and reviews in Google Maps.</p>
  <div id="list"></div>
</div>
<script>
(function () {
  var list = document.getElementById("list");
  var raw = location.hash.replace(/^#/, "");
  var items = raw ? raw.split("|").slice(0, 20) : [];
  var shown = 0;
  // Items are either a short code looked up in places.json (published from the
  // kiosk's restaurant list) or a self-contained Name~PlaceID.
  function render(places) {
  items.forEach(function (part) {
    var bits = part.split("~"), name, pid;
    if (bits.length < 2) {
      var p = places[part];
      if (!p) return;
      name = p.n; pid = p.p || "";
    } else {
      try { name = decodeURIComponent(bits[0] || ""); } catch (e) { name = bits[0] || ""; }
      pid = bits[1];
    }
    pid = pid.replace(/[^A-Za-z0-9_-]/g, "");
    if (!name) return;
    var url = pid
      ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name) + "&query_place_id=" + pid
      : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(name + ", Sun Peaks, BC");
    var a = document.createElement("a");
    a.className = "place"; a.href = url; a.rel = "noopener";
    var pin = document.createElement("span"); pin.className = "pin"; pin.textContent = String(++shown);
    var txt = document.createElement("span");
    var nm = document.createElement("div"); nm.className = "name"; nm.textContent = name;
    var hint = document.createElement("div"); hint.className = "hint"; hint.textContent = "Open in Google Maps";
    txt.appendChild(nm); txt.appendChild(hint);
    var go = document.createElement("span"); go.className = "go"; go.textContent = "\u203A";
    a.appendChild(pin); a.appendChild(txt); a.appendChild(go);
    list.appendChild(a);
  });
  if (!shown) list.innerHTML = '<div class="empty">This shortlist is empty.<br>Heart some restaurants on the lodge kiosk and scan again.</div>';
  }
  if (!items.some(function (p) { return p.indexOf("~") < 0; })) return render({});
  fetch("places.json").then(function (r) { return r.json(); })
    .then(function (j) { render(j.places || {}); }, function () { render({}); });
})();
</script>
</body>
</html>
