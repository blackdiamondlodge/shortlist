name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The runner image has Google Chrome; Selenium Manager fetches chromedriver.
      - run: pip install selenium
      - run: python -m unittest discover -v tests
